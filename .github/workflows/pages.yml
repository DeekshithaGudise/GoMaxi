name: Deploy GoMaxi to GitHub Pages

# Builds the app and pushes the static site to the `gh-pages` branch, which GitHub Pages serves at
# https://deekshithagudise.github.io/GoMaxi/ . Pushing to gh-pages needs no repository settings change.

on:
  push:
    branches: [c/youthful-rubin-82qfai, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for GitHub Pages (served under /GoMaxi/)
        run: npm run build
        env:
          VITE_BASE: /GoMaxi/
      - name: SPA fallback for deep links + disable Jekyll
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publish GoMaxi site from ${{ github.sha }}"
